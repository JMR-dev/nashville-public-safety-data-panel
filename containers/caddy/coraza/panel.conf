# What this application needs the Core Rule Set to stop doing, and why. Each exclusion names
# one rule, one place, and one reason: nothing here is a blanket "off".

# GraphQL writes its variables with a leading dollar sign ($filter, $first, $asOfVersion), and
# the MongoDB injection rule reads those as Mongo operators. Every operation the dashboard
# sends would be refused. There is no MongoDB anywhere in this deployment: the only database is
# SQLite, reached through parameterised statements, and the API exposes no mutations at all.
SecRule REQUEST_URI "@beginsWith /graphql" \
    "id:100001,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveTargetById=942290;ARGS:json.query"

# The status query asks for a field named "source", and the Unix command injection rule reads
# a line beginning with "source" as the shell builtin. Nothing in this application starts a
# process: the API and the worker make HTTP requests and SQLite queries, and there is no shell
# anywhere in the request path.
SecRule REQUEST_URI "@beginsWith /graphql" \
    "id:100002,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveTargetById=932235;ARGS:json.query"
