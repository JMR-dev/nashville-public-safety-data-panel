# Serving static files as an unprivileged user: no privileged port, no writable paths outside
# /tmp, and no log files to rotate because the logs go to the container's own streams.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;

    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    sendfile on;
    tcp_nopush on;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen 8080;
        listen [::]:8080;
        root /srv/dashboard;
        index index.html;

        # Vite gives every asset a content hash, so a cached copy can never be the wrong one.
        location /assets/ {
            add_header Cache-Control "public, immutable, max-age=31536000";
        }

        # The dashboard is one page; an unknown path is a mistake, not a route.
        location / {
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ =404;
        }
    }
}
