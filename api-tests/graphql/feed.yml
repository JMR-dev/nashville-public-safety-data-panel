info:
  name: Feed
  type: graphql
  seq: 3
graphql:
  url: "{{baseUrl}}/graphql"
  method: POST
  body:
    query: |
      query Feed($filter: CallFilter!, $first: Int!, $after: String, $asOfVersion: Int!) {
        calls(filter: $filter, first: $first, after: $after, asOfVersion: $asOfVersion) {
          asOfVersion
          pageInfo {
            endCursor
            hasNextPage
          }
          nodes {
            id
            receivedAt
            hasCoordinates
            sourcePresent
            record {
              OBJECTID
              Tencode_Description
              Disposition_Description
              Block
              Street_Name
              ZONE_
              Sector
            }
          }
        }
      }
    variables: |
      {
        "filter": { "since": "{{since}}", "until": "{{until}}" },
        "first": 50,
        "after": null,
        "asOfVersion": 2
      }
runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: 200
    - expression: res.body.errors
      operator: isUndefined
    - expression: res.body.data.calls.asOfVersion
      operator: eq
      value: 2
    - expression: res.body.data.calls.nodes
      operator: length
      value: 4
    - expression: res.body.data.calls.pageInfo.hasNextPage
      operator: isFalsy
  scripts:
    - type: tests
      code: |
        test("calls arrive newest first", function () {
          const times = res.body.data.calls.nodes.map((call) => Date.parse(call.receivedAt));
          expect(times).to.deep.equal([...times].sort((a, b) => b - a));
        });

        test("a call received 30 hours ago is outside the 24-hour window", function () {
          const ids = res.body.data.calls.nodes.map((call) => call.id);
          expect(ids).to.deep.equal(["1:5", "1:1", "1:2", "1:3"]);
        });

        test("records keep the field names Metro Nashville publishes", function () {
          const record = res.body.data.calls.nodes[0].record;
          expect(Object.keys(record)).to.deep.equal([
            "OBJECTID",
            "Tencode_Description",
            "Disposition_Description",
            "Block",
            "Street_Name",
            "ZONE_",
            "Sector"
          ]);
        });

        test("a call the source published without usable coordinates says so", function () {
          const byId = Object.fromEntries(res.body.data.calls.nodes.map((c) => [c.id, c]));
          expect(byId["1:2"].hasCoordinates).to.equal(false);
          expect(byId["1:1"].hasCoordinates).to.equal(true);
        });
docs: |
  The feed the dashboard lists. It is pinned to a data version so that paging through it cannot
  skip or repeat a call while the worker keeps committing.
