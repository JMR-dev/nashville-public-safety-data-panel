[project]
name = "nashville-panel"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.54",
    "strawberry-graphql[fastapi]>=0.327.7",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
panel = "panel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/panel"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
markers = [
    "deployment: builds and runs images, proxies, and host configuration; run with `pytest -m deployment --no-cov`",
]
filterwarnings = [
    "error",
    # Approved exception (2026-09-19, docs/dependency-decisions.md): uvloop 0.22.1 calls
    # asyncio.iscoroutinefunction, deprecated in Python 3.14 and slated for removal in 3.16.
    # Python attributes the warning to the caller of run_in_executor, so it is matched by
    # message. Strict Pyright separately reports any use of deprecated APIs in our own code.
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
]
# The deployment scenarios build images, start them, and load host configuration, so they are
# selected explicitly rather than run with every other test. CI runs them in their own job.
addopts = "-m 'not deployment' --cov=backend/panel --cov-branch --cov-report=term-missing --cov-report=json --cov-fail-under=100"

[tool.coverage.run]
source = ["backend/panel"]
branch = true
parallel = true

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pyright]
include = ["backend/panel", "backend/tests"]
extraPaths = ["backend"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16.8",
    "types-pyyaml>=6.0.12.20260906",
]
