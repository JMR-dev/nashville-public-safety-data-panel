[project]
name = "nashville-panel"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.54",
    "strawberry-graphql[fastapi]>=0.327.7",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
panel = "panel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/panel"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
addopts = "--cov=panel --cov=backend/migrations --cov-branch --cov-report=term-missing --cov-report=json --cov-fail-under=100"

[tool.coverage.run]
source = ["backend/panel", "backend/migrations"]
branch = true
parallel = true

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pyright]
include = ["backend/panel", "backend/migrations"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16.8",
    "types-pyyaml>=6.0.12.20260906",
]
