# A deployment's own inventory replaces this one. The management addresses are the only ones
# the host will accept administration from, so they are the deployment's to decide.
[panel]
panel.example.org

[panel:vars]
panel_site_address=panel.example.org
panel_acme_email=operations@example.org
panel_management_v4={ 203.0.113.0/24 }
panel_management_v6={ 2001:db8::/32 }
