# Coraza writes one JSON object per audited transaction. A transaction it stopped carries
# "is_interrupted": true, and the address is the one the connection came from: Caddy trusts no
# forwarding header, so a client cannot get somebody else banned by claiming their address.
[Definition]
failregex = ^.*"client_ip":"<HOST>".*"is_interrupted":\s*true
ignoreregex =
datepattern = "timestamp":"%%Y/%%m/%%d %%H:%%M:%%S"
